<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebPhone</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="WebPhone.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
    <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
    <script src="tabGuard.js"></script>
    <script src="appInterop.js"></script>
    <script src="pusherInterop.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/EverModern.Blazor.DirectCommunication/directCommunication.bundle.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        window.addEventListener('unhandledrejection', (event) => {
            const message = event?.reason?.message ?? '';
            if (typeof message === 'string' && message.includes('message channel closed before a response was received')) {
                event.preventDefault();
            }
        });

        (async function () {
            const allowed = await window.tabGuard.check();
            if (!allowed) {
                window.tabGuard.showBlocked();
                return;
            }
            await Blazor.start();
            if (navigator?.serviceWorker) {
                // Register service worker with no cache to always check for updates
                const registration = await navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).catch(() => { });

                if (registration) {
                    // Check for updates every 30 seconds
                    setInterval(() => {
                        registration.update();
                    }, 30000);

                    // Listen for updates from the service worker
                    navigator.serviceWorker.addEventListener('message', event => {
                        if (event.data?.type === 'SERVICE_WORKER_UPDATED') {
                            console.log('New version available, reloading...');
                            window.location.reload();
                        }
                    });

                    // Handle new service worker waiting to activate
                    if (registration.waiting) {
                        // New service worker is already waiting, activate it
                        registration.waiting.postMessage('SKIP_WAITING');
                    }

                    // Listen for new service worker installing
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        if (newWorker) {
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New service worker installed, tell it to activate
                                    newWorker.postMessage('SKIP_WAITING');
                                }
                            });
                        }
                    });

                    // Listen for controller change (new service worker activated)
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        console.log('Service worker updated, reloading page...');
                        window.location.reload();
                    });
                }
            }
        })();
    </script>
</body>

</html>
